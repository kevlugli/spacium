[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = 1

# The default session, also known as the greeter.
[default_session]

# dms-greeter runs its own compositor (Aqueous) and needs a writable HOME,
# which greetd does not set. Keep this in sync with
# /usr/lib/tmpfiles.d/spacium-greetd.conf.
command = "/usr/bin/env HOME=/var/cache/dms-greeter /usr/bin/dms-greeter --command aqueous --cache-dir /var/cache/dms-greeter"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "greeter"
