# /var is runtime state and is not deployed from the image, so (re)create the
# greeter home/cache at boot. /var/lib/noctalia-greeter covers a stale passwd
# home left behind by images that used the Noctalia greeter.
d /var/cache/dms-greeter 0755 greeter greeter -
d /var/lib/noctalia-greeter 0755 greeter greeter -
