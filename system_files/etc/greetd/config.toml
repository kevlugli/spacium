[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = 1

# The default session, also known as the greeter.
[default_session]

# Mandara Login runs inside cage, a kiosk Wayland compositor. The binary is
# symlinked to /usr/lib/mandara/mandara-greeter so it keeps its expected name.
command = "cage -s -m last -- /usr/lib/mandara/mandara-greeter greeter"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "greeter"
